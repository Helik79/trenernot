<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procvičování čtení not</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VexFlow pro vykreslení notové osnovy a not -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <!-- FontAwesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
        }
        .font-playful {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        /* Custom styles pro Vexflow canvas container */
        #vexflow-output {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
        }
        #vexflow-output svg {
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1));
            max-width: 100%;
            height: auto;
        }
        /* Animace pro rozsvícenou notu / aktivní stav */
        .pulse-glow {
            animation: pulse-glow 1.5s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.4)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.8)); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 p-4 sm:p-6">
    <!-- Hlavní Container -->
    <div class="max-w-3xl w-full mx-auto my-auto flex flex-col gap-6">

        <!-- Hlavička -->
        <header class="text-center">
            <h1 class="text-3xl sm:text-5xl font-bold font-playful text-indigo-900 tracking-wide drop-shadow-sm flex items-center justify-center gap-3">
                <i class="fa-solid font-normal fa-music text-pink-500 animate-bounce"></i>
                Procvičování Not
            </h1>
            <p class="text-slate-700 mt-2 text-sm sm:text-base font-semibold">
                Stupnice c1 až c3 — Jednočárkovaná a dvoučárkovaná oktáva
            </p>
        </header>

        <!-- Hlavní Karta s Osnovou a Ovládáním -->
        <main class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center relative overflow-hidden">
            
            <!-- Horní pruh: Časovač a Nastavení -->
            <div class="w-full flex justify-between items-center mb-4 flex-wrap gap-4 border-b border-indigo-100 pb-4">
                <!-- Odpočet času -->
                <div class="flex items-center gap-3 bg-indigo-50 border border-indigo-200 px-4 py-2 rounded-2xl">
                    <i class="fa-solid fa-clock text-indigo-600 text-xl"></i>
                    <div>
                        <span class="text-xs text-indigo-500 font-bold block uppercase tracking-wider">Zbývající čas</span>
                        <span id="timer-display" class="text-2xl font-bold font-playful text-indigo-900">20 s</span>
                    </div>
                </div>

                <!-- Výběr časového intervalu -->
                <div class="flex items-center gap-2">
                    <label for="interval-select" class="text-xs font-bold text-slate-600 uppercase tracking-wider">Interval:</label>
                    <select id="interval-select" class="bg-white border border-slate-300 font-semibold text-slate-700 py-1.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        <option value="5">5 s</option>
                        <option value="10">10 s</option>
                        <option value="15">15 s</option>
                        <option value="20" selected>20 s</option>
                        <option value="30">30 s</option>
                    </select>
                </div>

                <!-- Audio Tlačítko -->
                <button id="sound-toggle" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 font-medium text-sm transition bg-white px-3 py-1.5 rounded-xl border border-slate-200">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-indigo-600"></i>
                    <span id="sound-text">Zvuk ZAP</span>
                </button>
            </div>

            <!-- Plocha pro Notovou Osnovu (VexFlow Render Area) -->
            <div id="vexflow-output" class="w-full bg-white/95 rounded-2xl p-2 border border-slate-200 shadow-inner my-2 overflow-x-auto flex justify-center items-center">
                <!-- Vexflow vykresluje kompletní stupnici sem -->
            </div>

            <!-- Tlačítkový Panel Ovládání -->
            <div class="w-full grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6">
                <!-- Tlačítko START -->
                <button id="btn-start" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-500/30 transition-all flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-play"></i> Start
                </button>

                <!-- Tlačítko PAUZA -->
                <button id="btn-pause" disabled class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-amber-500/30 transition-all flex items-center justify-center gap-2 text-lg opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-pause"></i> Pauza
                </button>

                <!-- Tlačítko DALŠÍ -->
                <button id="btn-next" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-forward-step"></i> Další nota
                </button>
            </div>
        </main>

        <!-- Patčka -->
        <footer class="text-center text-xs font-semibold text-slate-600 opacity-80">
            Houslový klíč • Stupnice c1 až c3 (Jednočárkovaná a dvoučárkovaná oktáva)
        </footer>
    </div>

    <!-- JavaScript Aplikace -->
    <script>
        // --- DEFINICE CELÉ STUPNICE (c1 až c3 - 15 not) ---
        const NOTES = [
            { id: 'c1', vexKey: 'c/4', freq: 261.63 },
            { id: 'd1', vexKey: 'd/4', freq: 293.66 },
            { id: 'e1', vexKey: 'e/4', freq: 329.63 },
            { id: 'f1', vexKey: 'f/4', freq: 349.23 },
            { id: 'g1', vexKey: 'g/4', freq: 392.00 },
            { id: 'a1', vexKey: 'a/4', freq: 440.00 },
            { id: 'h1', vexKey: 'b/4', freq: 493.88 },
            { id: 'c2', vexKey: 'c/5', freq: 523.25 },
            { id: 'd2', vexKey: 'd/5', freq: 587.33 },
            { id: 'e2', vexKey: 'e/5', freq: 659.25 },
            { id: 'f2', vexKey: 'f/5', freq: 698.46 },
            { id: 'g2', vexKey: 'g/5', freq: 783.99 },
            { id: 'a2', vexKey: 'a/5', freq: 880.00 },
            { id: 'h2', vexKey: 'b/5', freq: 987.77 },
            { id: 'c3', vexKey: 'c/6', freq: 1046.50 }
        ];

        // --- STAV APLIKACE ---
        let activeNoteIndex = 0;
        let isRunning = false;
        let intervalDuration = 20; // vteřiny
        let timeRemaining = 20;
        let timerInterval = null;
        let soundEnabled = true;

        // Web Audio API Synthesizer
        let audioCtx = null;

        // --- DOM PRVKY ---
        const vexflowContainer = document.getElementById('vexflow-output');
        const timerDisplay = document.getElementById('timer-display');
        const intervalSelect = document.getElementById('interval-select');
        
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnNext = document.getElementById('btn-next');
        const soundToggle = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');

        // --- INICIALIZACE A VYKRESLENÍ VŠECH NOT NA OSNOVĚ ---
        const { Renderer, Stave, StaveNote, Formatter } = Vex.Flow;

        function renderStaffWithAllNotes() {
            vexflowContainer.innerHTML = ''; 

            const containerWidth = vexflowContainer.clientWidth || 700;
            const width = Math.max(containerWidth, 680);
            const height = 220;

            const renderer = new Renderer(vexflowContainer, Renderer.Backends.SVG);
            renderer.resize(width, height);
            const context = renderer.getContext();

            const staveWidth = width - 40;
            const stave = new Stave(20, 40, staveWidth);
            stave.addClef("treble"); 
            stave.setContext(context).draw();

            // Vytvoření všech 15 not
            const staveNotes = NOTES.map((noteObj, idx) => {
                const staveNote = new StaveNote({
                    keys: [noteObj.vexKey],
                    duration: "q" // čtvrťová nota pro úhledné vysázení
                });

                if (idx === activeNoteIndex) {
                    // Rozsvícená / aktivní nota (zářivě růžová/purpurová s odleskem)
                    staveNote.setStyle({
                        fillStyle: "#ec4899", 
                        strokeStyle: "#be185d"
                    });
                } else {
                    // Ostatní neaktivní noty (jemně šedé/tlumené)
                    staveNote.setStyle({
                        fillStyle: "#94a3b8", 
                        strokeStyle: "#64748b"
                    });
                }

                return staveNote;
            });

            Formatter.FormatAndDraw(context, stave, staveNotes);
        }

        // --- AUDIO ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNoteSound(freq) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.25);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        // --- HERNÍ LOGIKA ---
        function highlightRandomNote() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * NOTES.length);
            } while (nextIndex === activeNoteIndex && NOTES.length > 1);

            activeNoteIndex = nextIndex;
            const currentNote = NOTES[activeNoteIndex];

            renderStaffWithAllNotes();
            playNoteSound(currentNote.freq);
        }

        function startTimer() {
            if (isRunning) return;

            isRunning = true;
            btnStart.disabled = true;
            btnStart.classList.add('opacity-50', 'cursor-not-allowed');
            
            btnPause.disabled = false;
            btnPause.classList.remove('opacity-50', 'cursor-not-allowed');

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = `${timeRemaining} s`;

                if (timeRemaining <= 0) {
                    timeRemaining = intervalDuration;
                    highlightRandomNote();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(timerInterval);

            btnStart.disabled = false;
            btnStart.classList.remove('opacity-50', 'cursor-not-allowed');

            btnPause.disabled = true;
            btnPause.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function resetTimer() {
            timeRemaining = intervalDuration;
            timerDisplay.textContent = `${timeRemaining} s`;
        }

        // --- EVENT LISTENERY ---
        btnStart.addEventListener('click', () => {
            initAudio();
            startTimer();
        });

        btnPause.addEventListener('click', () => {
            pauseTimer();
        });

        btnNext.addEventListener('click', () => {
            initAudio();
            resetTimer();
            highlightRandomNote();
        });

        intervalSelect.addEventListener('change', (e) => {
            intervalDuration = parseInt(e.target.value, 10);
            resetTimer();
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-indigo-600';
                soundText.textContent = 'Zvuk ZAP';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-400';
                soundText.textContent = 'Zvuk VYP';
            }
        });

        window.addEventListener('resize', () => {
            renderStaffWithAllNotes();
        });

        window.onload = () => {
            highlightRandomNote();
        };
    </script>
</body>
</html>
